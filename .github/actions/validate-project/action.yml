name: Validate .NET Project
description: Validate that exactly one .csproj exists in the repository root

outputs:
  project:
    description: Path to the .csproj file
    value: ${{ steps.find-project.outputs.project }}

runs:
  using: composite

  steps:
    - name: Find project
      id: find-project
      shell: bash
      run: |
        mapfile -t PROJECTS < <(
          find . -maxdepth 1 -type f -name '*.csproj' -print
        )

        if [ "${#PROJECTS[@]}" -eq 0 ]; then
          echo "ERROR: No .csproj file found in the repository root."
          echo "Expected exactly one .csproj file."
          exit 1
        fi

        if [ "${#PROJECTS[@]}" -gt 1 ]; then
          echo "ERROR: Multiple .csproj files found in the repository root:"
          printf '  %s\n' "${PROJECTS[@]}"
          echo "Expected exactly one .csproj file."
          exit 1
        fi

        PROJECT="${PROJECTS[0]}"

        echo "Found project: $PROJECT"
        echo "project=$PROJECT" >> "$GITHUB_OUTPUT"